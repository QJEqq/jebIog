{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full p-8 backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl shadow-2xl shadow-blue-900/20">
        
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <div class="text-left">
                <p class="text-xs text-slate-400 uppercase tracking-widest">Восстановление для</p>
                <p class="text-white font-bold">{{ phone_number }}</p>
            </div>
            {% if not request.user.is_authenticated %}
            <a href="{% url 'users:password_reset_request' %}" class="text-xs font-semibold text-blue-400 hover:text-blue-300 transition flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                Изменить
            </a>
            {% endif %}
        </div>

        <h2 class="text-2xl font-extrabold text-white mb-2 drop-shadow-blue text-center">Новый пароль</h2>
        <p class="text-blue-200 text-sm mb-8 text-center">Введите код отправленный на {{ phone_number }}</p>

        <form method="POST" id="otp-form" class="space-y-6" autocomplete="off">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-widest text-slate-400">Код подтверждения</label>
                <div class="flex justify-between gap-3" id="otp-inputs">
                    <input type="text" maxlength="1" autocomplete="one-time-code" class="otp-field w-16 h-20 bg-slate-900/60 border border-white/10 rounded-xl text-center text-3xl font-bold text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition duration-200" autofocus>
                    <input type="text" maxlength="1" autocomplete="one-time-code" class="otp-field w-16 h-20 bg-slate-900/60 border border-white/10 rounded-xl text-center text-3xl font-bold text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition duration-200">
                    <input type="text" maxlength="1" autocomplete="one-time-code" class="otp-field w-16 h-20 bg-slate-900/60 border border-white/10 rounded-xl text-center text-3xl font-bold text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition duration-200">
                    <input type="text" maxlength="1" autocomplete="one-time-code" class="otp-field w-16 h-20 bg-slate-900/60 border border-white/10 rounded-xl text-center text-3xl font-bold text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition duration-200">
                    
                    <input type="hidden" name="code" id="full-code">
                </div>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-widest text-slate-400">Новый пароль</label>
                <input type="password" name="new_password" placeholder="••••••••" required autocomplete="new-password"
                       class="w-full bg-slate-900/60 border border-white/10 text-white p-4 rounded-xl focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition duration-200">
            </div>

            <button type="submit" class="w-full py-4 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-700/40 transition duration-200 uppercase tracking-widest text-sm">
                Сохранить пароль
            </button>
        </form>

        <div class="flex justify-center items-center mt-8">
            <a href="{% url 'users:resend_sms_un' %}" 
               class="text-sm text-blue-400 hover:text-blue-300 transition font-medium">
                Отправить код повторно
            </a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('.otp-field');
    const hiddenInput = document.getElementById('full-code');

    inputs.forEach((input, index) => {
        // Переход вперед при вводе цифры
        input.addEventListener('input', (e) => {
            if (e.target.value.length > 0 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
            updateCode();
        });

        // Переход назад при нажатии Backspace
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                inputs[index - 1].focus();
            }
        });
    });

    function updateCode() {
        let code = '';
        inputs.forEach(input => code += input.value);
        hiddenInput.value = code;
        console.log("Текущий код восстановления:", code);
    }
});
</script>
{% endblock %}
