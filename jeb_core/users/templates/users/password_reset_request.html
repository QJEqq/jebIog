{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20">
    <div class="bg-[#1a1a1a] p-8 rounded-2xl border border-zinc-800 shadow-2xl">
        <h2 class="text-xl font-black text-white uppercase tracking-wider mb-2 text-center">Восстановление доступа</h2>
        <p class="text-zinc-500 text-sm mb-6 text-center">Введите номер телефона, привязанный к вашему аккаунту JEB</p>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2">Номер телефона</label>
                <input id='phone-mask' type="text" name="phone_number" placeholder="+7 (999) 999-99-99" required
                       class="w-full bg-black border border-zinc-800 text-white p-3 rounded-xl focus:border-blue-600 outline-none transition-all">
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black uppercase tracking-widest py-4 rounded-xl transition-all text-sm">
                Получить код
            </button>
        </form>
    </div>
</div>
<script src="https://unpkg.com/imask"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const element = document.getElementById('phone-mask');
    const maskOptions = {
      mask: '8 (000) 000-00-00',
      lazy: false // Маска будет видна сразу (8 (___)...)
    };
    const mask = IMask(element, maskOptions);
  });
</script>
{% endblock %}
