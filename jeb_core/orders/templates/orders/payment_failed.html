{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center px-4 pt-6 lg:pt-10">
    <div class="max-w-md w-full bg-darkCard border border-rose-500/20 rounded-3xl p-8 sm:p-10 text-center relative overflow-hidden group shadow-2xl shadow-rose-950/10">

        <div class="absolute -right-20 -top-20 w-40 h-40 bg-rose-500/5 rounded-full blur-3xl group-hover:bg-rose-400/10 transition-all duration-500"></div>
   
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-2xl bg-rose-500/10 text-rose-400 mb-6 border border-rose-500/20 transition-all duration-300">
            <svg class="h-8 w-8 drop-shadow-[0_0_8px_rgba(244,63,94,0.5)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </div>
        
        <h1 class="text-2xl sm:text-3xl font-black text-white mb-3 tracking-wider uppercase">
            Сбой <span class="text-rose-400">оплаты</span>
        </h1>
        
        <p class="text-gray-400 text-xs sm:text-sm leading-relaxed mb-8">
            Транзакция не была завершена. Проверьте баланс вашего криптокошелька или статус подтверждения в сети блокчейн и попробуйте снова.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-3">
            <a href="{% url 'catalog:catalog' %}" class="flex-1 text-center bg-zinc-800 hover:bg-zinc-700 text-gray-300 px-4 py-3.5 rounded-full text-xs font-bold uppercase tracking-wider transition">
                В каталог
            </a>
            <!-- Замени 'cart:detail', если у тебя другой урл для корзины/оформления -->
            <a href="{% url 'main:Home_page' %}" class="flex-1 text-center bg-blue-600 hover:bg-blue-700 text-white px-4 py-3.5 rounded-full text-xs font-bold uppercase tracking-wider transition">
                На главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
