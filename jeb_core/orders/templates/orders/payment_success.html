{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center px-4 pt-6 lg:pt-10">
    <div class="max-w-md w-full bg-darkCard border border-blue-500/20 rounded-3xl p-8 sm:p-10 text-center relative overflow-hidden group shadow-2xl shadow-blue-950/20">

        <div class="absolute -right-20 -top-20 w-40 h-40 bg-blue-500/10 rounded-full blur-3xl group-hover:bg-blue-400/20 transition-all duration-500"></div>
  
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-2xl bg-blue-500/10 text-blue-400 mb-6 border border-blue-500/20 transition-all duration-300">
            <svg class="h-8 w-8 drop-shadow-[0_0_8px_rgba(96,165,250,0.5)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        
        <h1 class="text-2xl sm:text-3xl font-black text-white mb-3 tracking-wider uppercase">
            Оплата <span class="text-blue-400">принята</span>
        </h1>
        
        <p class="text-gray-300 text-xs sm:text-sm leading-relaxed mb-8">
            Ваш заказ успешно оформлен. Компоненты <span class="text-blue-400 font-semibold">JEB</span> уже переданы на сборочный стенд для 24-часового тестирования. Скоро менеджер свяжется с вами.
        </p>
        
        <div>
            <a href="{% url 'catalog:catalog' %}" class="inline-block w-full text-center bg-blue-600 hover:bg-blue-700 px-6 py-3.5 rounded-full text-xs sm:text-sm font-bold uppercase tracking-wider transition">
                В каталог
            </a>
        </div>
    </div>
</div>
{% endblock %}
